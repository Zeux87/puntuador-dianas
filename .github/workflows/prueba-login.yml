name: Prueba login (solo compilar)

on:
  push:
    branches:
      - prueba-login

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar el APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee compilacion.log

      - name: Mostrar errores de compilación
        if: failure()
        run: |
          grep -E "error:|e: |FAILURE|What went wrong" -A 3 compilacion.log | head -n 60 | while IFS= read -r l; do
            echo "::error::${l//%/%25}"
          done

