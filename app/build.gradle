plugins {
    id 'com.android.application'
}

def numeroCompilacion = Integer.parseInt(System.getenv('BUILD_NUMBER') ?: '1')

android {
    namespace 'es.pablo.puntuador'
    compileSdk 34

    defaultConfig {
        applicationId 'es.pablo.puntuador'
        minSdk 26
        targetSdk 34
        versionCode numeroCompilacion
        versionName "1.0.${numeroCompilacion}"
    }

    signingConfigs {
        release {
            storeFile file('puntuador.jks')
            storePassword 'puntuador'
            keyAlias 'puntuador'
            keyPassword 'puntuador'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    // Inicio de sesión con Google (Credential Manager)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    // Firebase: inicio de sesión y lista de acceso privada en Firestore
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}
