plugins {
    id 'com.android.application'
}

def numeroCompilacion = Integer.parseInt(System.getenv('BUILD_NUMBER') ?: '1')

android {
    namespace 'es.pablo.lectordianas'
    compileSdk 34

    defaultConfig {
        applicationId 'es.pablo.lectordianas'
        minSdk 24
        targetSdk 34
        versionCode numeroCompilacion
        versionName "1.0.${numeroCompilacion}"
    }

    signingConfigs {
        release {
            storeFile file('../app/puntuador.jks')
            storePassword 'puntuador'
            keyAlias 'puntuador'
            keyPassword 'puntuador'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Alinea las versiones de Kotlin que traen las librerías (evita clases duplicadas de kotlin-stdlib)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
